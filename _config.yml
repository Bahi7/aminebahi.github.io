# -----------------------------------------------------------------------------
# Site settings - Amine Bahi
# -----------------------------------------------------------------------------
title: "Amine Bahi"
first_name: Amine
middle_name:
last_name: Bahi

contact_note: >
  Best contact: amine.bahi@rabiata.com (industry) or amine.bahi@ens.psl.eu (academic).
  Open to research, consulting, and collaboration.

description: >
  PhD researcher in cryptography with the CASCADE team at Ecole normale superieure (ENS, Paris)
  and member of the Encrypted Systems Lab at Brown University.
  Interests: structured encryption, PIR/ORAM, volume-hiding systems, Post Quantum Security, quantitative trading.

footer_text: >
  Built with Jekyll & al-folio · Hosted on GitHub Pages.

keywords: cryptography, structured encryption, PIR, ORAM, volume-hiding, quantitative trading
lang: en
icon: "🔐"

url: "https://www.aminebahi.com"
baseurl: ""

last_updated: true
back_to_top: true
max_width: "1000px"

repo_theme_light: "dark"
repo_theme_dark: "midnight"

enable_project_categories: true
repo_trophies:
  enabled: false

enable_google_analytics: false
google_analytics: ""

enable_math: true
highlighter: rouge
markdown: kramdown

include:
  - _pages

collections:
  news:
    output: true
  projects:
    output: true
  books:
    output: true

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: page
  - scope:
      path: ""
      type: news
    values:
      layout: post

plugins:
  - jekyll-archives-v2
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll-scholar
  - jekyll-sitemap
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

# Jekyll Scholar
scholar:
  source: _bibliography
  bibliography: papers.bib
  sort_by: year
  order: descending

# Minification
minifier:
  remove_spaces_inside_tags: true
  remove_multi_spaces: true
  remove_comments: true
  compress_css: true
  compress_javascript: true
  uglifier_args:
    harmony: true

exclude:
  - vendor
  - node_modules
  - .devcontainer
  - .github
  - lighthouse_results
  - readme_preview
  - assets/jupyter
  - ._config.yml.swp
