- title: Research Experience
  type: time_table
  contents:
    - title: Research Intern
      institution: Northeastern University, Boston, USA
      year: 2023–2024
      description:
        - Designed and implemented a low-latency encrypted multi-map (EMM) in C++ with low-leakage and subliminal modes, integrating Path ORAM and queueing-theoretic techniques.
    - title: Doctoral Researcher
      institution: UM6P College of Computing, Marrakesh, Morocco
      year: 2020–2023
      description:
        - Researched searchable symmetric encryption (SSE), structured encryption, and multi-server volume-hiding EMM constructions; evaluated efficiency/leakage trade-offs empirically.
        - Implemented and benchmarked volume-hiding SSE schemes by extending the Clusion encrypted-search framework.
        - Studied SSE workload and leakage statistics, Zipf-like keyword distributions, and links to equity-market microstructure; investigated prophet inequalities and secretary-problem optimal stopping.
    - title: Research Intern
      institution: Inria, Lyon, France
      year: 2019
      description:
        - Integrated TFHE into an IoT healthcare activity-recognition system; implemented encrypted-inference circuits and optimized them through benchmarking.

